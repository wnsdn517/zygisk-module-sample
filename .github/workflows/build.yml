name: Build Zygisk Module

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew :module:assembleRelease

      - name: Update versionCode & prepare files
        run: |
          # 1. 기존 update.json에서 versionCode 읽기 (없거나 오류 시 기본값 100)
          if [ -f update.json ]; then
            CURRENT_CODE=$(jq -r '.versionCode // 100' update.json)
          else
            CURRENT_CODE=100
          fi

          NEW_CODE=$((CURRENT_CODE + 1))
          NEW_VERSION="v1.0.${NEW_CODE}"
          ZIP_URL="https://github.com/${{ github.repository }}/releases/latest/download/buildtype_fix.zip"
          CHANGELOG_URL="https://raw.githubusercontent.com/${{ github.repository }}/master/changelog.md"

          # 2. update.json 자동 갱신
          cat << EOF > update.json
          {
            "version": "${NEW_VERSION}",
            "versionCode": ${NEW_CODE},
            "zipUrl": "${ZIP_URL}",
            "changelog": "${CHANGELOG_URL}"
          }
          EOF

          # 3. out/buildtype_fix 디렉터리 생성 및 module.prop 작성
          mkdir -p out/buildtype_fix/zygisk

          UPDATE_URL="https://raw.githubusercontent.com/${{ github.repository }}/master/update.json"

          cat << EOF > out/buildtype_fix/module.prop
          id=buildtype_fix
          name=BuildType Fix Module
          version=${NEW_VERSION}
          versionCode=${NEW_CODE}
          author=Rocky
          description=Dynamically patches Build fields and Fingerprint for target applications.
          updateJson=${UPDATE_URL}
          EOF

          # 4. 기타 필수 파일 복사
          [ -f targets.txt ] && cp targets.txt out/buildtype_fix/targets.txt
          [ -f config.txt ] && cp config.txt out/buildtype_fix/config.txt
          [ -f customize.sh ] && cp customize.sh out/buildtype_fix/customize.sh

          # 5. 빌드된 .so 파일 복사
          find module/build -name "*.so" | while read f; do
            abi=$(basename "$(dirname "$f")")
            cp "$f" "out/buildtype_fix/zygisk/${abi}.so"
          done

          # 6. 모듈 ZIP 패키징
          cd out/buildtype_fix
          zip -r ../../buildtype_fix.zip .
          cd ../..

          # 환경 변수 전달 (Release 및 Commit용)
          echo "NEW_VERSION=${NEW_VERSION}" >> $GITHUB_ENV
          echo "NEW_CODE=${NEW_CODE}" >> $GITHUB_ENV

      # 7. 변경된 update.json 저장소에 자동 커밋 & 푸시
      - name: Commit updated update.json
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add update.json
          git commit -m "chore: bump versionCode to ${NEW_CODE} [skip ci]" || echo "No changes to commit"
          git push

      # 8. 이중 압축 방지 Artifact 업로드
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: buildtype_fix-${{ env.NEW_VERSION }}
          path: out/buildtype_fix/

      # 9. GitHub Release 생성 및 최신 ZIP 파일 업데이트
      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.NEW_VERSION }}
          name: Release ${{ env.NEW_VERSION }}
          files: buildtype_fix.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
