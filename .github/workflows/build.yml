name: Build Zygisk Module

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew :module:assembleRelease

      - name: Determine next version from existing Releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # git에 아무것도 커밋하지 않는다. 버전 번호는 GitHub Releases 목록에서
          # 직접 조회해서 결정한다 (repo state와 완전히 분리 -> 동기화 충돌 원천 차단).
          LATEST_TAG=$(gh release list --limit 1 --json tagName -q '.[0].tagName' 2>/dev/null || echo "")
          if [[ "$LATEST_TAG" =~ ^v1\.0\.([0-9]+)$ ]]; then
            CURRENT_CODE="${BASH_REMATCH[1]}"
          else
            CURRENT_CODE=100
          fi
          NEW_CODE=$((CURRENT_CODE + 1))
          NEW_VERSION="v1.0.${NEW_CODE}"
          echo "NEW_VERSION=${NEW_VERSION}" >> $GITHUB_ENV
          echo "NEW_CODE=${NEW_CODE}" >> $GITHUB_ENV

      - name: Prepare module files
        run: |
          ZIP_URL="https://github.com/${{ github.repository }}/releases/latest/download/buildtype_fix.zip"
          CHANGELOG_URL="https://raw.githubusercontent.com/${{ github.repository }}/master/changelog.md"
          UPDATE_URL="https://github.com/${{ github.repository }}/releases/latest/download/update.json"

          mkdir -p out/buildtype_fix/zygisk

          # update.json은 repo에 커밋하지 않고 Release 첨부파일로만 배포한다.
          cat << EOF > update.json
          {
            "version": "${NEW_VERSION}",
            "versionCode": ${NEW_CODE},
            "zipUrl": "${ZIP_URL}",
            "changelog": "${CHANGELOG_URL}"
          }
          EOF
          cp update.json out/buildtype_fix/update.json

          cat << EOF > out/buildtype_fix/module.prop
          id=buildtype_fix
          name=BuildType Fix Module
          version=${NEW_VERSION}
          versionCode=${NEW_CODE}
          author=Rocky
          description=Dynamically patches Build fields and Fingerprint for target applications.
          updateJson=${UPDATE_URL}
          EOF

          [ -f targets.txt ] && cp targets.txt out/buildtype_fix/targets.txt
          [ -f config.txt ] && cp config.txt out/buildtype_fix/config.txt
          [ -f customize.sh ] && cp customize.sh out/buildtype_fix/customize.sh
          [ -d webroot ] && cp -r webroot out/buildtype_fix/webroot

          find module/build -name "*.so" | while read f; do
            abi=$(basename "$(dirname "$f")")
            cp "$f" "out/buildtype_fix/zygisk/${abi}.so"
          done

          cd out/buildtype_fix
          zip -r ../../buildtype_fix.zip .
          cd ../..

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: buildtype_fix-${{ env.NEW_VERSION }}
          path: out/buildtype_fix/

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.NEW_VERSION }}
          name: Release ${{ env.NEW_VERSION }}
          files: |
            buildtype_fix.zip
            update.json
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
